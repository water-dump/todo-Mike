<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>민규의 할 일 목록</title>
  <style>
    :root {
      --bg-1: #ffe4f1;
      --bg-2: #e3ecff;
      --card: #ffffff;
      --text: #4a3f5c;
      --muted: #a89bb8;
      --line: #f1e8f7;
      --pink: #ff8fc7;
      --purple: #b18cff;
      --mint: #6fdcb8;
      --item: #fbf7ff;
      --error-bg: #ffe3ea;
      --error-text: #c2335b;
      --badge-bg: #ffe4f1;
      --badge-text: #d4579a;
      --danger: #e0344f;
      --danger-bg: #fff0f2;
      --shadow: 0 12px 32px rgba(177, 140, 255, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #2a2140;
        --bg-2: #1c2338;
        --card: #2c2741;
        --text: #f1eafc;
        --muted: #9b8fb3;
        --line: #3b3456;
        --item: #342e4c;
        --error-bg: #4a2537;
        --error-text: #ffb3c8;
        --badge-bg: #4a2a45;
        --badge-text: #ffb3d9;
        --danger: #ff6b81;
        --danger-bg: #46222f;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      color: var(--text);
      font-family: "Jua", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 28px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      text-align: center;
      font-weight: 400;
    }
    .subtitle {
      margin: 4px 0 20px;
      font-size: 14px;
      text-align: center;
      color: var(--muted);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    form .row {
      display: flex;
      gap: 8px;
    }
    .due-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 6px;
      font-size: 15px;
      color: var(--muted);
    }
    form input {
      min-width: 0;
      padding: 13px 18px;
      font: inherit;
      font-size: 17px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--item);
      color: var(--text);
      transition: border-color .15s;
    }
    form input::placeholder { color: var(--muted); }
    form input:focus { outline: none; border-color: var(--purple); }
    #todo-input { flex: 1; }
    #author-input { flex: 0 0 92px; padding: 13px 14px; }
    #due-input {
      padding: 6px 14px;
      font-size: 15px;
      color-scheme: light dark;
    }
    button.add {
      width: 50px;
      flex-shrink: 0;
      font-size: 26px;
      line-height: 1;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      cursor: pointer;
      transition: transform .12s;
    }
    button.add:hover { transform: scale(1.08) rotate(90deg); }
    button.add:active { transform: scale(0.95); }
    button.add:disabled { opacity: .5; cursor: wait; transform: none; }

    .error {
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 14px;
      word-break: break-word;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 10px 14px;
      background: var(--item);
      border-radius: 18px;
      animation: pop .25s ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 동글동글 체크박스 */
    li input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      margin: 0;
      flex-shrink: 0;
      border-radius: 50%;
      border: 3px solid var(--purple);
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: background .15s, border-color .15s;
    }
    li input[type="checkbox"]::after {
      content: "✓";
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      transform: scale(0);
      transition: transform .15s;
    }
    li input[type="checkbox"]:checked {
      background: var(--mint);
      border-color: var(--mint);
    }
    li input[type="checkbox"]:checked::after { transform: scale(1); }

    li .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    li .text, li .due {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    li .text {
      font-size: 17px;
      cursor: text;
    }
    li.done .text {
      text-decoration: line-through;
      text-decoration-color: var(--pink);
      text-decoration-thickness: 2px;
      color: var(--muted);
    }
    li .due {
      font-size: 13px;
      color: var(--muted);
    }
    li .due.tomorrow { color: var(--badge-text); }
    li .due.overdue { color: var(--danger); font-weight: 700; }

    /* 오늘 마감: 빨간 테두리 + 두근거리는 경고 */
    li.urgent {
      background: var(--danger-bg);
      box-shadow: inset 0 0 0 2px var(--danger);
    }
    li .due.today {
      align-self: flex-start;
      margin-top: 3px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(224, 52, 79, .55); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 7px rgba(224, 52, 79, 0); }
    }
    .today-alert {
      margin: 0 0 14px;
      padding: 12px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff4d67, #ff8fc7);
      color: #fff;
      font-size: 16px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(224, 52, 79, .3);
    }
    @media (prefers-reduced-motion: reduce) {
      li .due.today { animation: none; }
    }
    li .author {
      flex-shrink: 0;
      max-width: 6.5em;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    li.editing { flex-wrap: wrap; gap: 8px; }
    li .edit-due {
      font: inherit;
      font-size: 15px;
      padding: 4px 10px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      color-scheme: light dark;
      outline: none;
    }
    li .edit-due:focus { border-color: var(--purple); }
    li .edit-save { margin-left: auto; }
    li .edit-input {
      flex: 1 1 100%;
      min-width: 0;
      font: inherit;
      font-size: 17px;
      padding: 4px 10px;
      border: 2px solid var(--purple);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    li button.icon {
      border: none;
      background: none;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 6px;
      border-radius: 10px;
      opacity: .55;
      transition: opacity .12s, background .12s, transform .12s;
    }
    li button.icon:hover {
      opacity: 1;
      background: var(--line);
      transform: scale(1.1);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 0 12px;
      font-size: 16px;
    }
    .empty .big { font-size: 40px; display: block; margin-bottom: 6px; }
    .summary {
      text-align: center;
      margin: 18px 0 0;
      font-size: 16px;
      color: var(--purple);
    }
    .summary:empty { display: none; }
    .hint {
      text-align: center;
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* 좁은 휴대폰 화면 */
    @media (max-width: 400px) {
      li { gap: 8px; padding-left: 12px; }
      li button.icon { padding: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>민규의 할 일 목록</h1>
    <p class="subtitle">Mike's todo list</p>

    <form id="todo-form">
      <div class="row">
        <input type="text" id="author-input" placeholder="이름" maxlength="20" autocomplete="off" aria-label="작성자 이름 (안 적어도 돼요)">
        <input type="text" id="todo-input" placeholder="무엇을 할까요?" autocomplete="off" autofocus>
        <button type="submit" class="add" aria-label="추가">＋</button>
      </div>
      <label class="due-row">📅 마감일 <input type="date" id="due-input" aria-label="마감일 (안 정해도 돼요)"></label>
    </form>

    <p class="error" id="error" role="alert" hidden></p>
    <p class="today-alert" id="today-alert" role="status" hidden></p>
    <ul id="todo-list"></ul>
    <p class="empty" id="loading">불러오는 중이에요…</p>
    <p class="empty" id="empty" hidden><span class="big">🌷</span>아직 할 일이 없어요. 하나 추가해볼까요?</p>
    <p class="summary" id="summary"></p>
    <p class="hint" id="hint">✏️를 누르거나 글자를 더블클릭하면 내용과 마감일을 고칠 수 있어요</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const authorInput = document.getElementById('author-input');
    const dueInput = document.getElementById('due-input');

    // 이름 칸에 적은 이름은 이 브라우저에 기억해 둡니다.
    const AUTHOR_KEY = 'todo-author';
    try {
      authorInput.value = localStorage.getItem(AUTHOR_KEY) || '';
    } catch {}
    authorInput.addEventListener('input', () => {
      try {
        localStorage.setItem(AUTHOR_KEY, authorInput.value.trim());
      } catch {}
    });
    const addButton = form.querySelector('button.add');
    const errorBox = document.getElementById('error');
    const todayAlert = document.getElementById('today-alert');
    const list = document.getElementById('todo-list');
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const hint = document.getElementById('hint');

    // Supabase의 todos 표에 저장합니다.
    let db = null;
    let todos = [];
    let editingId = null;
    let isLoading = true;
    let adding = false;

    function showError(message, error) {
      const detail = error && error.message ? error.message : error;
      errorBox.textContent = `⚠️ ${message}${detail ? ` (${detail})` : ''}`;
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    // 마감이 가까운 순서로. 마감일이 없으면 맨 아래.
    // 마감일이 같거나 둘 다 없으면 만든 순서, 그다음 id 순서로.
    function byDue(a, b) {
      if (a.due_date !== b.due_date) {
        if (!a.due_date) return 1;
        if (!b.due_date) return -1;
        return a.due_date < b.due_date ? -1 : 1;
      }
      if (a.created_at !== b.created_at) return a.created_at < b.created_at ? -1 : 1;
      return a.id - b.id;
    }

    // 오늘 날짜를 내 컴퓨터 시간대 기준 'YYYY-MM-DD'로.
    function todayString() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    // 마감일 글자와 경고 단계(overdue / today / tomorrow / 없음)
    function dueInfo(due) {
      const [, month, day] = due.split('-').map(Number);
      const date = `📅 ${month}월 ${day}일`;
      const days = Math.round((Date.parse(due) - Date.parse(todayString())) / 86400000);
      if (days < 0) return { text: `${date} · ${-days}일 지났어요`, level: 'overdue' };
      if (days === 0) return { text: '🔥 오늘 마감!', level: 'today' };
      if (days === 1) return { text: `${date} · 내일까지`, level: 'tomorrow' };
      return { text: `${date} · D-${days}`, level: null };
    }

    function render() {
      list.innerHTML = '';
      for (const todo of todos) {
        list.appendChild(todo.id === editingId ? renderEditing(todo) : renderItem(todo));
      }

      const total = todos.length;
      const doneCount = todos.filter(t => t.done).length;
      loading.hidden = !isLoading;
      empty.hidden = isLoading || total > 0;
      hint.hidden = total === 0;

      const today = todayString();
      const dueToday = todos.filter(t => !t.done && t.due_date === today).length;
      todayAlert.hidden = dueToday === 0;
      todayAlert.textContent = `🔥 오늘 마감인 할 일이 ${dueToday}개 남았어요! 오늘 안에 꼭 끝내요 💪`;

      if (total === 0) summary.textContent = '';
      else if (doneCount === total) summary.textContent = '🎉 모두 끝냈어요! 최고예요!';
      else if (doneCount === 0) summary.textContent = `💪 할 일 ${total}개, 화이팅!`;
      else summary.textContent = `🎉 ${total}개 중 ${doneCount}개 완료했어요!`;
    }

    function renderItem(todo) {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.setAttribute('aria-label', `"${todo.text}" 완료`);
      checkbox.addEventListener('change', async () => {
        const done = checkbox.checked;
        todo.done = done;
        render();
        const { error } = await db.from('todos').update({ done }).eq('id', todo.id);
        if (error) {
          todo.done = !done;
          render();
          showError('완료 표시를 저장하지 못했어요', error);
        } else {
          clearError();
        }
      });

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = todo.text;
      text.addEventListener('dblclick', () => startEdit(todo.id));

      const body = document.createElement('div');
      body.className = 'body';
      body.append(text);
      if (todo.due_date) {
        const { text: label, level } = dueInfo(todo.due_date);
        const due = document.createElement('span');
        due.className = 'due';
        due.textContent = label;
        // 완료한 할 일에는 경고를 띄우지 않습니다.
        if (!todo.done && level) {
          due.classList.add(level);
          if (level === 'today') li.classList.add('urgent');
        }
        body.append(due);
      }
      li.append(checkbox, body);

      if (todo.author) {
        const author = document.createElement('span');
        author.className = 'author';
        author.textContent = todo.author;
        author.title = `작성자: ${todo.author}`;
        li.append(author);
      }

      const edit = document.createElement('button');
      edit.className = 'icon';
      edit.textContent = '✏️';
      edit.title = '수정';
      edit.setAttribute('aria-label', `"${todo.text}" 수정`);
      edit.addEventListener('click', () => startEdit(todo.id));

      const del = document.createElement('button');
      del.className = 'icon';
      del.textContent = '🗑️';
      del.title = '삭제';
      del.setAttribute('aria-label', `"${todo.text}" 삭제`);
      del.addEventListener('click', async () => {
        todos = todos.filter(t => t.id !== todo.id);
        render();
        const { error } = await db.from('todos').delete().eq('id', todo.id);
        if (error) {
          todos.push(todo);
          todos.sort(byDue);
          render();
          showError('할 일을 삭제하지 못했어요', error);
        } else {
          clearError();
        }
      });

      li.append(edit, del);
      return li;
    }

    function renderEditing(todo) {
      const li = document.createElement('li');
      li.className = 'editing';

      const field = document.createElement('input');
      field.type = 'text';
      field.className = 'edit-input';
      field.value = todo.text;
      field.setAttribute('aria-label', '할 일 수정');

      const dueField = document.createElement('input');
      dueField.type = 'date';
      dueField.className = 'edit-due';
      dueField.value = todo.due_date || '';
      dueField.setAttribute('aria-label', '마감일 수정');

      const clearDue = document.createElement('button');
      clearDue.type = 'button';
      clearDue.className = 'icon';
      clearDue.textContent = '✕';
      clearDue.title = '마감일 지우기';
      clearDue.setAttribute('aria-label', '마감일 지우기');

      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.className = 'icon edit-save';
      saveButton.textContent = '✅';
      saveButton.title = '저장';
      saveButton.setAttribute('aria-label', '저장');

      let finished = false;
      const finish = async (save) => {
        if (finished) return;
        finished = true;
        editingId = null;

        const changes = {};
        const value = field.value.trim();
        // 빈 칸으로 저장하면 원래 내용을 유지합니다.
        if (value && value !== todo.text) changes.text = value;
        // 날짜를 덜 입력했으면 원래 마감일을 유지합니다.
        const due = dueField.validity.badInput ? todo.due_date : (dueField.value || null);
        if (due !== todo.due_date) changes.due_date = due;

        if (!save || Object.keys(changes).length === 0) {
          render();
          return;
        }
        const previous = { text: todo.text, due_date: todo.due_date };
        Object.assign(todo, changes);
        todos.sort(byDue);
        render();
        const { error } = await db.from('todos').update(changes).eq('id', todo.id);
        if (error) {
          Object.assign(todo, previous);
          todos.sort(byDue);
          render();
          showError('고친 내용을 저장하지 못했어요', error);
        } else {
          clearError();
        }
      };

      // 버튼을 눌러도 입력칸에서 포커스가 빠져나가지 않게 합니다.
      for (const button of [clearDue, saveButton]) {
        button.addEventListener('mousedown', (e) => e.preventDefault());
      }
      clearDue.addEventListener('click', () => { dueField.value = ''; });
      saveButton.addEventListener('click', () => finish(true));

      li.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finish(true);
        else if (e.key === 'Escape') finish(false);
      });
      // 내용 칸과 마감일 칸 사이를 옮겨 다닐 때는 그대로 두고, 바깥을 누르면 저장합니다.
      li.addEventListener('focusout', (e) => {
        if (!li.contains(e.relatedTarget)) finish(true);
      });

      li.append(field, dueField, clearDue, saveButton);
      requestAnimationFrame(() => {
        field.focus();
        field.select();
      });
      return li;
    }

    function startEdit(id) {
      editingId = id;
      render();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      // 이름은 안 적어도 돼요. 빈 칸이면 null로 저장합니다.
      const author = authorInput.value.trim() || null;
      // 마감일도 안 정해도 돼요.
      const due_date = dueInput.value || null;
      if (!text || !db || adding) return;

      adding = true;
      addButton.disabled = true;
      const { data, error } = await db.from('todos').insert({ text, author, due_date }).select().single();
      adding = false;
      addButton.disabled = false;

      // 실패하면 입력한 글자를 남겨둬서 다시 시도할 수 있게 합니다.
      if (error) {
        showError('할 일을 추가하지 못했어요', error);
        input.focus();
        return;
      }
      clearError();
      todos.push(data);
      todos.sort(byDue);
      input.value = '';
      dueInput.value = '';
      input.focus();
      render();
    });

    async function load() {
      const { data, error } = await db
        .from('todos')
        .select('id, text, done, author, due_date, created_at')
        .order('due_date', { nullsFirst: false })
        .order('created_at')
        .order('id');
      isLoading = false;
      if (error) showError('할 일을 불러오지 못했어요', error);
      else todos = data.sort(byDue);
      render();
    }

    if (!window.supabase || typeof SUPABASE_URL === 'undefined') {
      isLoading = false;
      showError('Supabase에 연결할 수 없어요', 'Supabase 라이브러리나 config.js를 불러오지 못했어요');
      render();
    } else {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      render();
      load();
    }
  </script>
</body>
</html>
